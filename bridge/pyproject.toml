[project]
name = "sans-nom-bridge"
version = "0.1.0"
description = "Phase 0 Python sidecar for Sans-Nom Honcho operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "honcho-ai>=2.1.1,<3.0.0",
  "voyageai>=0.3.0",
  "qdrant-client>=1.12.0"
]

[project.scripts]
comic-lore = "bridge.comic_lore:main"
peer-cards = "bridge.peer_cards:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0"
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
